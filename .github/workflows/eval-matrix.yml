name: DataReady Eval Matrix

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  eval-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Force deterministic path in CI (no secrets required).
      GEMINI_API_KEY: ""
      DATAREADY_VERTEX_PROJECT: ""
      DATAREADY_DISABLE_LLM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run eval matrix
        run: |
          python backend/scripts/run_eval_matrix.py > eval-matrix.json 2> eval-matrix-stderr.log || true
          if [ -s eval-matrix-stderr.log ]; then
            echo "::warning::Eval script stderr output:"
            cat eval-matrix-stderr.log
          fi

      - name: Show summary
        run: |
          python - <<'PY'
          import json, sys, os
          path = 'eval-matrix.json'
          if not os.path.exists(path) or os.path.getsize(path) == 0:
              print("::warning::eval-matrix.json is empty — script may have crashed. Check logs above.")
              sys.exit(0)
          try:
              d = json.load(open(path))
          except json.JSONDecodeError:
              print("::warning::eval-matrix.json is not valid JSON — printing raw content:")
              print(open(path).read()[:2000])
              sys.exit(0)
          s = d['summary']
          print(f"Total: {s['total']}  Passed: {s['passed']}  Failed: {s['failed']}")
          if s['failures']:
              print("Failures:", s['failures'])
          # Fail CI only if more than 30% of cases fail (allow some drift in deterministic mode)
          if s['total'] > 0 and s['failed'] / s['total'] > 0.3:
              print("::error::More than 30% of eval cases failed.")
              sys.exit(1)
          PY
