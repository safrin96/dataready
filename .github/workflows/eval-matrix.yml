name: DataReady Eval Matrix

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  eval-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Force deterministic path in CI (no secrets required).
      GEMINI_API_KEY: ""
      DATAREADY_VERTEX_PROJECT: ""
      DATAREADY_DISABLE_LLM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run eval matrix
        run: |
          python backend/scripts/run_eval_matrix.py > eval-matrix.json

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('eval-matrix.json'))
          print(d['summary'])
          PY
